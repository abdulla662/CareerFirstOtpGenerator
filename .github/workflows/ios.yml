name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Install MAUI workloads
      run: dotnet workload install maui-ios maui-android
      
    - name: Build iOS
      run: dotnet build CareerFirstOtpGenerator/CareerFirstOtpGenerator.csproj -f net8.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=false -p:EnableCodeSigning=false
          
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: '**/bin/Release/net8.0-ios/**/*.app'
